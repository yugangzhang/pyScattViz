[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyScattViz"
version = "0.6.0"
description = "Local, lazy-loading visualization for NSLS-II scattering data"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "Yugang Zhang", email = "yuzhang@bnl.gov"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.23",
  "matplotlib>=3.5",
  "pandas>=1.5",
  "Pillow>=9",
  "plotly>=5.18",
  "scipy>=1.7",
  "seaborn>=0.12",
  "streamlit>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pyscattviz = "pyscattviz.cli:main"

[project.urls]
Homepage = "https://github.com/yugangzhang/pyScattViz"
Issues = "https://github.com/yugangzhang/pyScattViz/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["N999"]
